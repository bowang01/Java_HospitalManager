# Hostinger Docker Manager: paste this YAML (Compose manually).
# Project name becomes the default subdomain: <project>.<TRAEFIK_HOST>
# Join the existing reverse-proxy network. Change PROXY_NETWORK if yours is not traefik-proxy.
# Do not publish 80/443 here. The shared proxy already owns those ports.

services:
  web:
    build:
      context: ${VUE_CONTEXT:-https://github.com/bowang01/HospitalManagerVue.git#master}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - api
    labels:
      - traefik.enable=true
      - traefik.docker.network=${PROXY_NETWORK:-traefik-proxy}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-hospital}.rule=Host(`${COMPOSE_PROJECT_NAME:-hospital}.${TRAEFIK_HOST}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-hospital}.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-hospital}.tls.certresolver=letsencrypt
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-hospital}-http.rule=Host(`${COMPOSE_PROJECT_NAME:-hospital}.${TRAEFIK_HOST}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-hospital}-http.entrypoints=web
      - traefik.http.services.${COMPOSE_PROJECT_NAME:-hospital}.loadbalancer.server.port=80
    networks:
      - internal
      - proxy

  api:
    build:
      context: ${API_CONTEXT:-https://github.com/bowan12345/Java_HospitalManager.git#master}
    restart: unless-stopped
    expose:
      - "9092"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/hospital_manager?characterEncoding=utf8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  mysql:
    build:
      context: ${API_CONTEXT:-https://github.com/bowan12345/Java_HospitalManager.git#master}
      dockerfile: Dockerfile.mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: hospital_manager
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

volumes:
  mysql_data:
  redis_data:

networks:
  internal:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-traefik-proxy}
