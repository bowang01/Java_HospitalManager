services:
  mysql:
    image: mysql:8.0
    container_name: hospital-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: hospital_manager
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hospital_root_pass}

    volumes:
      - hospital-mysql-data:/var/lib/mysql

    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD:-hospital_root_pass}"
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  hospitalapi:
    build:
      context: .
    container_name: hospitalapi
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

    ports:
      - "127.0.0.1:19092:9092"

    environment:
      SERVER_PORT: 9092
      SERVER_ADDRESS: 0.0.0.0

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/hospital_manager?characterEncoding=utf8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hospital_root_pass}

      REDIS_HOST: redis
      REDIS_PORT: 6379

    networks:
      - default
      - proxy

  redis:
    image: redis:7-alpine
    container_name: hospital-redis
    restart: unless-stopped

    volumes:
      - hospital-redis-data:/data

    command: ["redis-server", "--appendonly", "yes"]

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  hospital-mysql-data:
  hospital-redis-data:

networks:
  proxy:
    external: true
    name: proxy